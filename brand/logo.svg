<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" width="460" height="96" role="img" aria-label="ptero-bulk-9router">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19c37d"/>
      <stop offset="100%" stop-color="#0f8a58"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#19c37d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded icon tile -->
  <g filter="url(#soft)">
    <rect x="8" y="18" width="60" height="60" rx="16" fill="url(#gd)"/>
  </g>

  <!-- 9router glyph inside the tile: a small node graph -->
  <g fill="#04120b">
    <circle cx="24" cy="34" r="4"/>
    <circle cx="52" cy="34" r="4"/>
    <circle cx="38" cy="62" r="4"/>
  </g>
  <g stroke="#04120b" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="24" y1="34" x2="38" y2="62"/>
    <line x1="52" y1="34" x2="38" y2="62"/>
    <line x1="24" y1="34" x2="52" y2="34"/>
  </g>
  <g fill="#eafff5">
    <circle cx="24" cy="34" r="1.8"/>
    <circle cx="52" cy="34" r="1.8"/>
    <circle cx="38" cy="62" r="1.8"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">
    ptero<tspan fill="#19c37d">-bulk-9router</tspan>
  </text>
</svg>
